####################################################################
## 🌸 Kitty Configuration by De Denkwegweiser
## ✨ Inspired by minimal, aesthetic setup for Hyprland
## 🛠️ Last updated: 2025-04-21
####################################################################

##############################
## 🎨 Appearance
##############################

font_family        JetBrainsMono Nerd Font
bold_font          JetBrainsMono Nerd Font Bold
italic_font        JetBrainsMono Nerd Font Italic
bold_italic_font   JetBrainsMono Nerd Font Bold Italic
font_size          13.0

background_opacity 0.90
# background_blur 100   # ❌ Disabled - Hyprland handles blur

confirm_os_window_close 0
shell_integration enabled

##############################
## 🌈 Colorscheme
##############################

include ~/.config/kitty/themes/Catppuccin-Macchiato.conf
# You can switch to themes like Dracula, Tokyo Night, Nord, etc.

##############################
## 🧷 Tab Bar
##############################

tab_bar_style         fade
tab_powerline_style   slanted

active_tab_background   #a6e3a1
inactive_tab_background #313244
active_tab_foreground   #1e1e2e
inactive_tab_foreground #cdd6f4

active_tab_title_template {title}{' 🌸 '}
inactive_tab_title_template {title}

##############################
## 🖼️ Window Logo (Optional)
##############################

window_logo_path     none
# window_logo_path   ~/.config/kitty/logo.png
window_logo_position bottom-left

##############################
## 🖱️ Cursor & Scrolling
##############################

scrollback_lines       10000
enable_audio_bell      no
cursor_shape           block
cursor_blink_interval  0.6

##############################
## 🎹 Keyboard Shortcuts 
##############################

# 💡 Suggestions:
# map kitty_mod+enter new_tab_with_cwd
# map kitty_mod+e launch --type=overlay nvim

#
# ---- Tab management ----

# Open new tab
map ctrl+t new_tab

# Close current tab
map ctrl+w close_tab

# Switch to next tab
map ctrl+tab next_tab

# Switch to previous tab
map ctrl+shift+tab previous_tab

# ---- Scratchpad ------
# Open scratchpad for quick access applications
map ctrl+shift+s toggle_scratchpad

# ---- Resizing -------
# Start resizing window
map ctrl+shift+r resize_window

# Toggle fullscreen mode
map ctrl+shift+f fullscreen_window

# ---- Clear terminal ---
# Clear entire terminal (scrollback buffer)
map ctrl+shift+x clear_terminal

# --- Copy/Paste -----
# Copy to clipboard (Shift + C)
map ctrl+shift+c copy_to_clipboard

# Paste from clipboard (Shift + V)
map ctrl+shift+v paste_from_clipboard

copy_on_select on

# --- Font resizing ----
# Increase font size
map ctrl+plus increase_font_size

# Decrease font size
map ctrl+minus decrease_font_size

##############################
## ⚙️ Other Settings
##############################

remember_window_size   yes
update_check_interval  0
allow_remote_control   yes

####################################################################
## Default Config
####################################################################

# ============================================================================== #
#                               FONT                                             #
# ============================================================================== #

font_family      JetBrainsMono NerdFont
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12.0

# ============================================================================== #
#                               CURSOR                                           #
# ============================================================================== #
cursor_shape block
cursor_beam_thickness 3.0
cursor_underline_thickness 3.0
cursor_blink_interval -1
cursor_stop_blinking_after 10.0

# ============================================================================== #
#                               SCROLLBACK                                       #
# ============================================================================== #

scrollback_lines 2000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 0
scrollback_fill_enlarged_window no
wheel_scroll_multiplier 5.0
wheel_scroll_min_lines 1
touch_scroll_multiplier 1.0

# ============================================================================== #
#                               MOUSE                                            #
# ============================================================================== #

mouse_hide_wait 3.0
url_style dashed
# -> none | straight | double | curly | dotted | dashed

copy_on_select yes

click_interval -1.0
focus_follows_mouse no

pointer_shape_when_grabbed arrow
default_pointer_shape beam
pointer_shape_when_dragging beam

# ============================================================================== #
#                               PERFORMANCE TUNING                               #
# ============================================================================== #

repaint_delay 10
input_delay 3
sync_to_monitor yes

# ============================================================================== #
#                               TERMINAL BELL                                   #
# ============================================================================== #

enable_audio_bell yes
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab "🔔 "
command_on_bell none
bell_path none
linux_bell_theme __custom

# ============================================================================== #
#                                     WINDOW                                     #
# ============================================================================== #

remember_window_size  no
initial_window_width  900
initial_window_height 556
window_border_width 0.0pt
draw_minimal_borders yes
window_margin_width 0
single_window_margin_width -1
window_padding_width 0
placement_strategy center
inactive_text_alpha 0.8
hide_window_decorations yes
window_logo_path none
window_logo_position bottom-right
window_logo_alpha 0.5
resize_debounce_time 0.1 0.5
resize_in_steps no
confirm_os_window_close -1

# ============================================================================== #
#                                    TAB_BAR                                     #
# ============================================================================== #

tab_bar_edge bottom
tab_bar_style powerline
tab_bar_align left
tab_bar_min_tabs 1
tab_switch_strategy previous

tab_fade 0.25 0.5 0.75 1
tab_separator " ┇"
tab_powerline_style angled

# ============================================================================== #
#                                COLORSCHEME                                     #
# ============================================================================== #
background_opacity 0.6
background_blur 100
background_image none
dynamic_background_opacity no
background_tint 0.0
dim_opacity 0.4

themes --reload-in=all Catppuccin-Macchiato

# ============================================================================== #
#                                  ADVANCE                                       #
# ============================================================================== #

shell /usr/bin/tmux
editor /usr/bin/nvim
close_on_child_death no
remote_control_password
allow_remote_control no
update_check_interval 24

clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
clipboard_max_size 512

allow_hyperlinks yes

shell_integration enabled

allow_cloning ask

term xterm-kitty

# ============================================================================== #
#                              OS Specific tweaks                                #
# ============================================================================== #

# --- Linux distro --- #
wayland_titlebar_color system
linux_display_server auto

# --- macOS --- #
macos_titlebar_color system
macos_option_as_alt yes
macos_hide_from_tasks no
macos_quit_when_last_window_closed no
macos_window_resizable yes

# ============================================================================== #
#                              KEYBOARD SHORTCUTS                                #
# ============================================================================== #
# * -> map Ctrl+A something
# map multiple keys: map key1>key2>key3 action

clear_all_shortcuts no

###### CLIPBOARD #######
# Copy and Paste operations
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard

###### SCROLLING #######
map kitty_mod+up    scroll_line_up
map kitty_mod+down  scroll_line_down
map page_up     scroll_page_up
map page_down   scroll_page_down

map kitty_mod+home scroll_home
map kitty_mod+end scroll_end
map kitty_mod+z scroll_to_prompt -1
map kitty_mod+x scroll_to_prompt 1

map kitty_mod+h show_scrollback
map kitty_mod+g show_last_command_output

###### WINDOW MANAGEMENT #######
# Passing because of using tmux.

###### TAB MANAGEMENT #######
map ctrl+pageup previous_tab
map ctrl+pagedown next_tab

map ctrl+t new_tab
map ctrl+w close_tab

map ctrl+q close_os_window

map kitty_mod+. move_tab_forward
map kitty_mod+, move_tab_backward

map kitty_mod+alt+t set_tab_title
map shift+cmd+i     set_tab_title

###### SPECIAL ######
map kitty_mod+escape kitty_shell window
map kitty_mod+f5 load_config_file
map ctrl+cmd+,   load_config_file

# ============================================================================== #
#                              THEMES INCLUDED                                   #
# ============================================================================== #

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include themes/tokyo-night-kitty.conf
# END_KITTY_THEME

# ------ tmux startup -----
# Start tmux automatically when Kitty is launched
shell /usr/bin/tmux


