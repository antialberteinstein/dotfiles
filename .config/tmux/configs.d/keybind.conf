# --- Split panes using | and - --- #
bind | split-window -h                        # Split pane horizontally
bind - split-window -v                        # Split pane vertically
unbind '"'                                     # Unbind default vertical split
unbind %                                       # Unbind default horizontal split

# --- Reload config file --- #
bind r source-file $HOME/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# --- Move between panes using Alt + arrow keys --- #
bind -n M-Left select-pane -L                 # Move to left pane
bind -n M-Right select-pane -R                # Move to right pane
bind -n M-Up select-pane -U                   # Move to upper pane
bind -n M-Down select-pane -D                 # Move to lower pane

# --- Resize panes using Alt + h/j/k/l --- #
bind -n M-h resize-pane -L 5                  # Resize pane left
bind -n M-l resize-pane -R 5                  # Resize pane right
bind -n M-j resize-pane -D 2                  # Resize pane down
bind -n M-k resize-pane -U 2                  # Resize pane up

# --- Pane management --- #
bind z resize-pane -Z                         # Toggle zoom for current pane
bind x kill-pane                              # Close current pane
bind X kill-window                            # Close current window
bind < swap-pane -U                           # Swap current pane up
bind > swap-pane -D                           # Swap current pane down

# --- Window navigation --- #
bind -n C-Left previous-window                # Move to previous window
bind -n C-Right next-window                   # Move to next window

# --- Window/session control --- #
bind S new-session                            # Create new session
bind s choose-session                         # List available sessions

# --- Layouts --- #
bind space next-layout                        # Cycle through layouts

# --- Copy mode and buffers --- #
bind [ copy-mode                              # Enter copy mode
bind ] paste-buffer                           # Paste from buffer
bind b list-buffers                           # List all buffers

# --- Git helper shortcut --- #
bind g split-window -v "lazygit || git status; read"    # Open lazygit in a new pane

