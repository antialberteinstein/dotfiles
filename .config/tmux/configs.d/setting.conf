##### --- MOUSE MODE --- #####
set -g mouse on                                # Enable mouse support for tmux (scrolling, resizing, selecting panes)

##### --- STOP AUTOMATIC RENAMING --- #####
set-option -g allow-rename off                 # Disable automatic renaming of windows

##### --- SET BASE INDEX TO 1 --- #####
set -g base-index 1                            # Start window numbering at 1 (default is 0)
setw -g pane-base-index 1                      # Start pane numbering at 1 (default is 0)

##### --- SET DEFAULT SHELL --- #####
set -g default-shell /usr/bin/fish             # Set default shell to Fish (instead of Bash)

##### --- STATUS BAR CUSTOMIZATION --- #####
set -g status on                             # Enable the status bar
set -g status-position bottom                # Position the status bar at the bottom (default is top)
set -g status-right "#(date '+%H:%M:%S')"    # Display current time on the right
set -g status-left '#(whoami)'               # Display current username on the left
set -g status-interval 1                     # Update status every second

##### --- WINDOW & PANE BEHAVIOR --- #####
set -g window-status-current-format '#I:#W'  # Display window index and name (e.g. 1:my-window)
setw -g window-status-current-style 'fg=yellow,bold'  # Highlight the current window with yellow color and bold text
set -g pane-border-status top                # Show pane borders at the top
set -g pane-active-border-style 'fg=green'    # Change active pane border color to green

##### --- HISTORY LIMIT --- #####
set -g history-limit 10000                   # Increase scrollback buffer to 10,000 lines (default is 2000)

##### --- AUTOMATIC WINDOW RENAMING --- #####
set -g automatic-rename on                   # Automatically rename windows based on the running command
set -g automatic-rename-format '#W'          # Format the name as the window name (default)

##### --- PANE SWITCHING --- #####
set -g pane-border-status top                # Place pane borders at the top of the pane
setw -g focus-events on                       # Focus events enable faster switching between panes

##### --- LIMIT LOGS AND OUTPUT --- #####
set -g display-panes-time 3000               # Time in milliseconds to display pane number (default is 1000)
set -g display-time 1000                     # Time in milliseconds for status messages to show

##### --- STARTUP SPEED IMPROVEMENTS --- #####
set -g focus-events off                      # Disable focus events to reduce start-up time
set -g history-file /dev/null                # Disable saving history (optional, to reduce startup time)


