# === DESIGN TWEAKS ===

# --- CUSTOM COLORS ---
# Define color variables for easier future modification
set -g @color_fg      colour1
set -g @color_bg      colour0
set -g @color_active  colour3
set -g @color_inactive colour7
set -g @color_bell    colour2
set -g @color_mode_bg colour18

# --- BELL / ACTIVITY ---
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# --- CLOCK MODE ---
setw -g clock-mode-colour colour1


# --- COPY MODE ---
setw -g mode-style "fg=#{@color_fg} bg=#{@color_mode_bg} bold"

# --- PANE BORDERS ---
set -g pane-border-style "fg=#{@color_fg}"
set -g pane-active-border-style "fg=#{@color_active}"

# --- STATUS BAR ---
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#{@color_fg} bg=#{@color_bg}"

set -g status-left ''
set -g status-right '#[bold] %Y-%m-%d #[fg=#{@color_active}]%H:%M '

set -g status-right-length 50
set -g status-left-length 10

# --- WINDOW TABS ---
setw -g window-status-current-style "fg=#{@color_bg} bg=#{@color_fg} bold"
setw -g window-status-current-format ' #I #[bold]#W #F '

setw -g window-status-style "fg=#{@color_fg} dim"
setw -g window-status-format ' #I #[fg=#{@color_inactive}]#W #[fg=#{@color_fg}]#F '

setw -g window-status-bell-style "fg=#{@color_bell} bg=#{@color_fg} bold"

# --- MESSAGES ---
set -g message-style "fg=#{@color_bell} bg=#{@color_bg} bold"

# --- COLOR SUPPORT ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

